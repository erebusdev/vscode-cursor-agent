name: Build

# PR / manual check only. Pushes to main are built and released by release.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: cursor-agent-vsix
          path: build/*.vsix
          if-no-files-found: error
